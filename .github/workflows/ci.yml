name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (LLVM-MinGW)
            os: windows-latest
          - name: Linux x64 (GCC)
            os: ubuntu-latest
          - name: macOS arm64 (Clang)
            os: macos-latest
    env:
      LLVM_MINGW: llvm-mingw-20261020-ucrt-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/$env:LLVM_MINGW.zip"
          curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o llvm-mingw.zip $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive llvm-mingw.zip -DestinationPath "$env:RUNNER_TEMP"
          "$env:RUNNER_TEMP\$env:LLVM_MINGW\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          echo "CC=gcc" >> "$GITHUB_ENV"

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          echo "CC=clang" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  cross-compile:
    name: Cross-compile (Raspberry Pi, Cortex-M, AVR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            gcc-avr avr-libc qemu-user

      - name: Compile every target and scan symbols
        run: tools/check_cross.sh

      - name: Test on aarch64 under QEMU
        run: |
          cmake -S . -B build-aarch64 -G Ninja \
            --toolchain cmake/toolchains/aarch64-linux-gnu.cmake -DIMPROC_WERROR=ON
          cmake --build build-aarch64
          ctest --test-dir build-aarch64 --output-on-failure
