<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" width="1280" height="1000" role="img" aria-labelledby="t d">
<title id="t">可分離濾波</title>
<desc id="d">box_filter、gaussian_blur、sobel 都先對每一列做水平 pass 寫入中間緩衝 tmp，再做垂直 pass 寫入 dst。邊界一律使用 reflect 101：水平方向先複製到 pad，垂直方向用 border_reflect_101 挑 tmp 的列。</desc>
<defs>
<style>
svg{font-family:"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC","Helvetica Neue",Arial,sans-serif;font-size:13px}
text{fill:#1F2328}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
.s12{font-size:12px}.s11{font-size:11px}.h{font-size:15px;font-weight:700}.ttl{font-size:22px;font-weight:700}
.sub{font-size:13px;fill:#57606A}.sec{fill:#57606A}.red{fill:#CF222E}.b{font-weight:700}.mid{text-anchor:middle}.end{text-anchor:end}
.api{fill:#DDF4FF;stroke:#0969DA;stroke-width:1.5}
.data{fill:#DAFBE1;stroke:#1A7F37;stroke-width:1.5}
.kern{fill:#FFF8C5;stroke:#9A6700;stroke-width:1.5}
.exe{fill:#FBEFFF;stroke:#8250DF;stroke-width:1.5}
.ext{fill:#F6F8FA;stroke:#6E7781;stroke-width:1.5}
.err{fill:#FFEBE9;stroke:#CF222E;stroke-width:1.5}
.panel{fill:none;stroke:#D0D7DE;stroke-width:1}
.e{stroke:#57606A;stroke-width:1.5;fill:none}
</style>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606A"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="1000" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="32" y="44" class="ttl">可分離濾波：水平 pass → 中間緩衝 tmp → 垂直 pass</text>
<text x="32" y="66" class="sub">core/filter.c：box_filter、gaussian_blur、sobel；邊界一律 reflect 101</text>

<!-- ===== Top strip: border reflect 101 ===== -->
<rect x="32" y="90" width="1216" height="170" rx="8" class="panel"/>
<text x="48" y="112" class="h">邊界：reflect 101（gfedcb|abcdefgh|gfedcba）</text>

<text x="172" y="153" class="s12 sec end">src 一列</text>
<g class="m s12">
<rect x="180" y="130" width="56" height="36" rx="6" class="data"/><text x="208" y="153" class="mid">s0</text>
<rect x="236" y="130" width="56" height="36" rx="6" class="data"/><text x="264" y="153" class="mid">s1</text>
<rect x="292" y="130" width="56" height="36" rx="6" class="data"/><text x="320" y="153" class="mid">s2</text>
<rect x="348" y="130" width="56" height="36" rx="6" class="data"/><text x="376" y="153" class="mid">s3</text>
<rect x="404" y="130" width="56" height="36" rx="6" class="data"/><text x="432" y="153" class="mid">s4</text>

<rect x="68" y="200" width="56" height="36" rx="6" class="kern"/><text x="96" y="223" class="mid">s2</text>
<rect x="124" y="200" width="56" height="36" rx="6" class="kern"/><text x="152" y="223" class="mid">s1</text>
<rect x="180" y="200" width="56" height="36" rx="6" class="data"/><text x="208" y="223" class="mid">s0</text>
<rect x="236" y="200" width="56" height="36" rx="6" class="data"/><text x="264" y="223" class="mid">s1</text>
<rect x="292" y="200" width="56" height="36" rx="6" class="data"/><text x="320" y="223" class="mid">s2</text>
<rect x="348" y="200" width="56" height="36" rx="6" class="data"/><text x="376" y="223" class="mid">s3</text>
<rect x="404" y="200" width="56" height="36" rx="6" class="data"/><text x="432" y="223" class="mid">s4</text>
<rect x="460" y="200" width="56" height="36" rx="6" class="kern"/><text x="488" y="223" class="mid">s3</text>
<rect x="516" y="200" width="56" height="36" rx="6" class="kern"/><text x="544" y="223" class="mid">s2</text>
</g>
<path d="M320,168 L320,198" class="e" marker-end="url(#arr)"/>
<text x="328" y="187" class="m s12">pad_row(s, pad, cols, cn, r)</text>
<text x="68" y="254" class="s12 sec">黃 = 反射延伸的像素（此例 r = 2），綠 = 原本的像素</text>

<g class="m s12">
<text x="620" y="134">border_reflect_101(p, len)：</text>
<text x="620" y="150">  len == 1 → 0</text>
<text x="620" y="166">  p &lt; 0 → −p</text>
<text x="620" y="182">  p &gt;= len → 2×(len − 1) − p</text>
<text x="620" y="198">  重複直到 0 &lt;= p &lt; len</text>
<text x="620" y="218" class="s11 sec">filter.c:7-15</text>
</g>
<g class="s12">
<text x="900" y="134">水平邊界：<tspan class="m">pad_row</tspan> 把延伸後的一列</text>
<text x="900" y="150">複製到 <tspan class="m">pad</tspan></text>
<text x="900" y="174">垂直邊界：不複製；用</text>
<text x="900" y="190" class="m">border_reflect_101(y ± k, rows)</text>
<text x="900" y="206">挑 <tspan class="m">tmp</tspan> 的列</text>
</g>

<!-- ===== Lane frames ===== -->
<rect x="32" y="290" width="378" height="660" rx="8" class="panel"/>
<rect x="445" y="290" width="378" height="660" rx="8" class="panel"/>
<rect x="858" y="290" width="378" height="660" rx="8" class="panel"/>

<!-- ===== Lane 1: box_filter ===== -->
<text x="46" y="308" class="m b">box_filter(dst, src, ksize)</text>
<text x="396" y="308" class="m s11 sec end">filter.c:74-119</text>
<text x="46" y="326" class="m s12 sec">CV_8UC1/3/4 → 同型別；ksize 為奇數，1..255</text>

<rect x="46" y="350" width="350" height="40" rx="6" class="data"/>
<text x="58" y="368" class="m s12">mat_row(src, y)</text>
<text x="58" y="384" class="s12 sec">uchar，cols × cn</text>
<path d="M221,390 L221,412" class="e" marker-end="url(#arr)"/>

<rect x="46" y="414" width="350" height="52" rx="6" class="kern"/>
<text x="58" y="434" class="m s12">pad_row(s, pad, cols, cn, r)，r = ksize / 2</text>
<text x="58" y="452" class="m s12 sec">pad：(cols + 2r) × cn bytes</text>
<path d="M221,466 L221,488" class="e" marker-end="url(#arr)"/>

<rect x="46" y="490" width="350" height="84" rx="6" class="kern"/>
<text x="58" y="510" class="m s12 b">box_hrow：滑動視窗和</text>
<text x="58" y="530" class="m s12">sum += 進入視窗的像素；sum −= 離開的像素</text>
<text x="58" y="550" class="s12 sec">最大 255 × 255 = 65025，放得進 <tspan class="m">uint16_t</tspan></text>
<path d="M221,574 L221,596" class="e" marker-end="url(#arr)"/>
<text x="229" y="590" class="s12 sec">第一個 for y 迴圈：所有列</text>

<rect x="46" y="598" width="350" height="56" rx="6" class="data"/>
<text x="58" y="620" class="m s12">tmp：uint16_t[rows × n]</text>
<text x="58" y="638" class="m s12 sec">n = cols × cn</text>
<path d="M221,654 L221,676" class="e" marker-end="url(#arr)"/>
<text x="229" y="670" class="s12 sec">第二個 for y 迴圈</text>

<rect x="46" y="678" width="350" height="132" rx="6" class="kern"/>
<g class="m s12">
<text x="58" y="700">sum：uint32_t[n]，欄方向的累加</text>
<text x="58" y="719">初始：i = −r..r，</text>
<text x="58" y="738">  colsum_add(tmp 第 reflect101(i) 列)</text>
<text x="58" y="757">每列：box_vrow → d = (sum + area/2) / area</text>
<text x="58" y="776">然後 colsum_add(第 reflect101(y+r+1) 列)</text>
<text x="58" y="795">      colsum_sub(第 reflect101(y−r) 列)</text>
</g>
<path d="M221,810 L221,832" class="e" marker-end="url(#arr)"/>

<rect x="46" y="834" width="350" height="44" rx="6" class="data"/>
<text x="58" y="861" class="m s12">mat_row(dst, y)：uchar</text>

<text x="46" y="908" class="m s12">area = ksize × ksize</text>
<text x="46" y="926" class="s12 sec">除法含四捨五入：(sum + area/2) / area</text>

<!-- ===== Lane 2: gaussian_blur ===== -->
<text x="459" y="308" class="m b">gaussian_blur(dst, src, ksize)</text>
<text x="809" y="308" class="m s11 sec end">filter.c:121-188</text>
<text x="459" y="326" class="m s12 sec">CV_8UC1/3/4 → 同型別；ksize ∈ {1, 3, 5, 7}</text>

<rect x="459" y="350" width="350" height="40" rx="6" class="data"/>
<text x="471" y="368" class="m s12">mat_row(src, y)</text>
<text x="471" y="384" class="s12 sec">uchar，cols × cn</text>
<path d="M634,390 L634,412" class="e" marker-end="url(#arr)"/>

<rect x="459" y="414" width="350" height="52" rx="6" class="kern"/>
<text x="471" y="434" class="m s12">pad_row(s, pad, cols, cn, r)，r = ksize / 2</text>
<text x="471" y="452" class="m s12 sec">pad：(cols + 2r) × cn bytes</text>
<path d="M634,466 L634,488" class="e" marker-end="url(#arr)"/>

<rect x="459" y="490" width="350" height="84" rx="6" class="kern"/>
<text x="471" y="510" class="m s12 b">gauss_hrow：acc = Σ w[k] × pad[i + k×cn]</text>
<text x="471" y="530" class="m s12">w = gauss_weights[r]，每軸總和 256</text>
<text x="471" y="550" class="s12 sec">最大 256 × 255 = 65280，放得進 <tspan class="m">uint16_t</tspan></text>
<path d="M634,574 L634,596" class="e" marker-end="url(#arr)"/>
<text x="642" y="590" class="s12 sec">第一個 for y 迴圈：所有列</text>

<rect x="459" y="598" width="350" height="56" rx="6" class="data"/>
<text x="471" y="620" class="m s12">tmp：uint16_t[rows × n]</text>
<text x="471" y="638" class="m s12 sec">n = cols × cn</text>
<path d="M634,654 L634,676" class="e" marker-end="url(#arr)"/>
<text x="642" y="670" class="s12 sec">第二個 for y 迴圈</text>

<rect x="459" y="678" width="350" height="132" rx="6" class="kern"/>
<g class="m s12">
<text x="471" y="700" class="b">gauss_vrow：acc = Σ w[k] × rows_in[k][i]</text>
<text x="471" y="722">rows_in[k] = tmp 第 reflect101(y + k − r) 列</text>
<text x="471" y="744">d = (acc + 32768) &gt;&gt; 16</text>
</g>
<text x="471" y="768" class="s12">兩軸各放大 256 倍，</text>
<text x="471" y="786" class="s12">最後一次除以 65536 並四捨五入</text>
<path d="M634,810 L634,832" class="e" marker-end="url(#arr)"/>

<rect x="459" y="834" width="350" height="44" rx="6" class="data"/>
<text x="471" y="861" class="m s12">mat_row(dst, y)：uchar</text>

<text x="459" y="904" class="s11 sec"><tspan class="m">gauss_weights[r]</tspan>（每軸總和皆為 256）</text>
<g class="m s11">
<text x="459" y="920">1: {256}</text>
<text x="459" y="934">3: {64, 128, 64}</text>
<text x="609" y="920">5: {16, 64, 96, 64, 16}</text>
<text x="609" y="934">7: {8, 28, 56, 72, 56, 28, 8}</text>
</g>

<!-- ===== Lane 3: sobel ===== -->
<text x="872" y="308" class="m b">sobel(dst, src, dx, dy)</text>
<text x="1222" y="308" class="m s11 sec end">filter.c:207-244</text>
<text x="872" y="324" class="m s12 sec">CV_8UC1 → CV_16SC1</text>
<text x="872" y="340" class="m s12 sec">(dx, dy) 只能是 (1, 0) 或 (0, 1)</text>

<rect x="872" y="350" width="350" height="40" rx="6" class="data"/>
<text x="884" y="368" class="m s12">mat_row(src, y)</text>
<text x="884" y="384" class="s12 sec">uchar，cols</text>
<path d="M1047,390 L1047,412" class="e" marker-end="url(#arr)"/>

<rect x="872" y="414" width="350" height="52" rx="6" class="kern"/>
<text x="884" y="434" class="m s12">pad_row(s, pad, cols, 1, 1)</text>
<text x="884" y="452" class="m s12 sec">pad：cols + 2 bytes</text>
<path d="M1047,466 L1047,488" class="e" marker-end="url(#arr)"/>

<rect x="872" y="490" width="350" height="84" rx="6" class="kern"/>
<g class="m s12">
<text x="884" y="509" class="b">sobel_hrow：</text>
<text x="884" y="526">w[0]×p[i] + w[1]×p[i+1] + w[2]×p[i+2]</text>
<text x="884" y="543">dx = 1：wh = diff {−1, 0, 1}</text>
<text x="884" y="560">dy = 1：wh = smooth {1, 2, 1}</text>
</g>
<path d="M1047,574 L1047,596" class="e" marker-end="url(#arr)"/>
<text x="1055" y="590" class="s12 sec">第一個 for y 迴圈：所有列</text>

<rect x="872" y="598" width="350" height="56" rx="6" class="data"/>
<text x="884" y="620" class="m s12">tmp：int16_t[rows × cols]</text>
<text x="884" y="638" class="s12 sec">單通道，n = cols</text>
<path d="M1047,654 L1047,676" class="e" marker-end="url(#arr)"/>
<text x="1055" y="670" class="s12 sec">第二個 for y 迴圈</text>

<rect x="872" y="678" width="350" height="132" rx="6" class="kern"/>
<g class="m s12">
<text x="884" y="700" class="b">sobel_vrow：w[0]×t0 + w[1]×t1 + w[2]×t2</text>
<text x="884" y="722">t0 = tmp 第 reflect101(y−1) 列</text>
<text x="884" y="741">t1 = 第 y 列；t2 = 第 reflect101(y+1) 列</text>
<text x="884" y="760">dx = 1：wv = smooth；dy = 1：wv = diff</text>
</g>
<text x="884" y="786" class="s12">不縮放、不捨入；輸出範圍 ±1020</text>
<path d="M1047,810 L1047,832" class="e" marker-end="url(#arr)"/>

<rect x="872" y="834" width="350" height="44" rx="6" class="data"/>
<text x="884" y="861" class="m s12">mat_row(dst, y)：int16_t</text>

<text x="872" y="908" class="s12 sec">要顯示時再呼叫</text>
<text x="872" y="926" class="m s12">convert_scale_abs(edge, grad, 256, 0)</text>

<text x="32" y="976" class="s12">tmp、pad、sum 都用 <tspan class="m">fast_malloc</tspan> 配置，函式結束前 <tspan class="m">fast_free</tspan></text>
</svg>
