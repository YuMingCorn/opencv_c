<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1440" width="1280" height="1440" role="img" aria-labelledby="t d">
<title id="t">可分離濾波：水平 pass、環形緩衝區與暫存記憶體</title>
<desc id="d">box_filter、gaussian_blur、sobel 都分成水平與垂直兩個 pass，中間只保留 min(window, rows) 列的環形緩衝區 ring（列 y 放槽位 y % nslots），而不是整張暫存影像。box 另有 uint32 欄累加 sum，在槽位被覆蓋前先減掉離開的列。圖中列出各濾波的暫存大小，以及大小檢查與 improc_scratch_check 的失敗路徑。邊界一律使用 reflect 101。</desc>
<defs>
<style>
svg{font-family:"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC","Helvetica Neue",Arial,sans-serif;font-size:13px}
text{fill:#1F2328}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
.s12{font-size:12px}.s11{font-size:11px}.h{font-size:15px;font-weight:700}.ttl{font-size:22px;font-weight:700}
.sub{font-size:13px;fill:#57606A}.sec{fill:#57606A}.red{fill:#CF222E}.b{font-weight:700}.mid{text-anchor:middle}.end{text-anchor:end}
.api{fill:#DDF4FF;stroke:#0969DA;stroke-width:1.5}
.data{fill:#DAFBE1;stroke:#1A7F37;stroke-width:1.5}
.kern{fill:#FFF8C5;stroke:#9A6700;stroke-width:1.5}
.exe{fill:#FBEFFF;stroke:#8250DF;stroke-width:1.5}
.ext{fill:#F6F8FA;stroke:#6E7781;stroke-width:1.5}
.err{fill:#FFEBE9;stroke:#CF222E;stroke-width:1.5}
.panel{fill:none;stroke:#D0D7DE;stroke-width:1}
.e{stroke:#57606A;stroke-width:1.5;fill:none}
</style>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606A"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="1440" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="32" y="44" class="ttl">可分離濾波：水平 pass → 環形緩衝區 ring → 垂直 pass</text>
<text x="32" y="66" class="sub">core/filter.c：box_filter、gaussian_blur、sobel；邊界一律 reflect 101；暫存只有 ksize 列，不是整張影像</text>

<!-- ===== Top strip: border reflect 101 ===== -->
<rect x="32" y="90" width="1216" height="170" rx="8" class="panel"/>
<text x="48" y="112" class="h">邊界：reflect 101（gfedcb|abcdefgh|gfedcba）</text>

<text x="172" y="153" class="s12 sec end">src 一列</text>
<g class="m s12">
<rect x="180" y="130" width="56" height="36" rx="6" class="data"/><text x="208" y="153" class="mid">s0</text>
<rect x="236" y="130" width="56" height="36" rx="6" class="data"/><text x="264" y="153" class="mid">s1</text>
<rect x="292" y="130" width="56" height="36" rx="6" class="data"/><text x="320" y="153" class="mid">s2</text>
<rect x="348" y="130" width="56" height="36" rx="6" class="data"/><text x="376" y="153" class="mid">s3</text>
<rect x="404" y="130" width="56" height="36" rx="6" class="data"/><text x="432" y="153" class="mid">s4</text>

<rect x="68" y="200" width="56" height="36" rx="6" class="kern"/><text x="96" y="223" class="mid">s2</text>
<rect x="124" y="200" width="56" height="36" rx="6" class="kern"/><text x="152" y="223" class="mid">s1</text>
<rect x="180" y="200" width="56" height="36" rx="6" class="data"/><text x="208" y="223" class="mid">s0</text>
<rect x="236" y="200" width="56" height="36" rx="6" class="data"/><text x="264" y="223" class="mid">s1</text>
<rect x="292" y="200" width="56" height="36" rx="6" class="data"/><text x="320" y="223" class="mid">s2</text>
<rect x="348" y="200" width="56" height="36" rx="6" class="data"/><text x="376" y="223" class="mid">s3</text>
<rect x="404" y="200" width="56" height="36" rx="6" class="data"/><text x="432" y="223" class="mid">s4</text>
<rect x="460" y="200" width="56" height="36" rx="6" class="kern"/><text x="488" y="223" class="mid">s3</text>
<rect x="516" y="200" width="56" height="36" rx="6" class="kern"/><text x="544" y="223" class="mid">s2</text>
</g>
<path d="M320,168 L320,198" class="e" marker-end="url(#arr)"/>
<text x="328" y="187" class="m s12">pad_row(s, pad, cols, cn, r)</text>
<text x="68" y="254" class="s12 sec">黃 = 反射延伸的像素（此例 r = 2），綠 = 原本的像素</text>

<g class="m s12">
<text x="620" y="134">border_reflect_101(p, len)：</text>
<text x="620" y="150">  len == 1 → 0</text>
<text x="620" y="166">  p &lt; 0 → −p</text>
<text x="620" y="182">  p &gt;= len → 2×(len − 1) − p</text>
<text x="620" y="198">  重複直到 0 &lt;= p &lt; len</text>
<text x="620" y="218" class="s11 sec">filter.c:16-24（int32_t 運算）</text>
</g>
<g class="s12">
<text x="900" y="134">水平邊界：<tspan class="m">pad_row</tspan> 把延伸後的一列</text>
<text x="900" y="150">複製到 <tspan class="m">pad</tspan>（filter.c:38-47）</text>
<text x="900" y="174">垂直邊界：不複製；用</text>
<text x="900" y="190" class="m">border_reflect_101(y ± k, rows)</text>
<text x="900" y="206">挑 <tspan class="m">ring</tspan> 裡對應那一列的槽位</text>
</g>

<!-- ===== Ring panel ===== -->
<rect x="32" y="280" width="1216" height="168" rx="8" class="panel"/>
<text x="48" y="302" class="h">環形緩衝區：列 y 放槽位 y % nslots（例：ksize = 3，r = 1，輸出第 3 列）</text>
<g class="m s12 mid">
<text x="255" y="330" class="sec">slot 0</text><text x="385" y="330" class="sec">slot 1</text><text x="515" y="330" class="sec">slot 2</text>
</g>
<rect x="200" y="338" width="110" height="40" rx="6" class="data"/>
<rect x="330" y="338" width="110" height="40" rx="6" class="data"/>
<rect x="460" y="338" width="110" height="40" rx="6" class="kern"/>
<g class="s12 mid">
<text x="255" y="363">第 3 列</text><text x="385" y="363">第 4 列</text><text x="515" y="363">第 2 列</text>
</g>
<text x="190" y="363" class="m s12 sec end">ring</text>
<text x="64" y="404" class="m s12">列 → 槽位：0→0、1→1、2→2、3→0、4→1、5→2</text>
<text x="64" y="426" class="s12">輸出第 3 列讀第 2、3、4 列。補算第 5 列會寫入槽位 5 % 3 = 2，覆蓋第 2 列（黃）。</text>
<g class="s12">
<text x="640" y="326"><tspan class="m">nslots = min(window, rows)</tspan>；window = <tspan class="m">ksize</tspan>（box、gauss）或 3（sobel）</text>
<text x="640" y="346">輸出列 y 只讀第 <tspan class="m">max(0, y−r)</tspan> 到 <tspan class="m">min(rows−1, y+r)</tspan> 列，</text>
<text x="640" y="364">最多連續 window 列，所以槽位在它的列還要用時，不會被覆蓋。</text>
<text x="640" y="388">box 多一步：先 <tspan class="m">colsum_sub</tspan> 減掉離開的列，</text>
<text x="640" y="406">才補算新列覆蓋同一槽位（新列 y+r+1 與舊列 y−r 差 ksize，槽位相同）。</text>
<text x="640" y="430" class="sec">演算法與輸出和整張 tmp 版本完全相同；改變的只有暫存量。</text>
</g>

<!-- ===== Lane frames ===== -->
<rect x="32" y="470" width="378" height="786" rx="8" class="panel"/>
<rect x="445" y="470" width="378" height="786" rx="8" class="panel"/>
<rect x="858" y="470" width="378" height="786" rx="8" class="panel"/>

<text x="46" y="488" class="m b">box_filter(dst, src, ksize)</text>
<text x="396" y="488" class="m s11 sec end">filter.c:96-160</text>
<text x="46" y="506" class="m s12 sec">CV_8UC1/3/4 → 同型別；ksize 為奇數，1..255</text>
<rect x="46" y="530" width="350" height="40" rx="6" class="data"/>
<text x="58" y="548" class="m s12">mat_row(src, y)</text>
<text x="58" y="564" class="s12 sec">uchar，cols × cn</text>
<path d="M221,570 L221,592" class="e" marker-end="url(#arr)"/>
<rect x="46" y="594" width="350" height="52" rx="6" class="kern"/>
<text x="58" y="614" class="m s12">pad_row(s, pad, cols, cn, r)，r = ksize / 2</text>
<text x="58" y="632" class="m s12 sec">pad：(cols + 2r) × cn bytes</text>
<path d="M221,646 L221,668" class="e" marker-end="url(#arr)"/>
<rect x="46" y="670" width="350" height="84" rx="6" class="kern"/>
<text x="58" y="690" class="m s12 b">box_hrow：滑動視窗和</text>
<text x="58" y="710" class="m s12">sum += 進入視窗的像素；sum −= 離開的像素</text>
<text x="58" y="730" class="s12 sec">最大 255 × 255 = 65025，放得進 <tspan class="m">uint16_t</tspan></text>
<path d="M221,754 L221,778" class="e" marker-end="url(#arr)"/>
<text x="229" y="772" class="s12 sec">for y：補算新列的水平 pass</text>
<rect x="46" y="780" width="350" height="76" rx="6" class="data"/>
<text x="58" y="800" class="m s12">ring：uint16_t[nslots × n]</text>
<text x="58" y="818" class="m s12 sec">nslots = min(ksize, rows)，n = cols × cn</text>
<text x="58" y="836" class="m s12 sec">列 y 放槽位 y % nslots（ring_slot）</text>
<path d="M221,856 L221,878" class="e" marker-end="url(#arr)"/>
<text x="229" y="872" class="s12 sec">每個輸出列 y</text>
<rect x="46" y="880" width="350" height="150" rx="6" class="kern"/>
<text x="58" y="900" class="m s12 b">sum：uint32_t[n]，欄方向的累加</text>
<text x="58" y="919" class="m s12">初始：i = −r..r，colsum_add(第 reflect101(i) 列)</text>
<text x="58" y="938" class="m s12">每列 y：</text>
<text x="58" y="957" class="m s12">1. box_vrow：d = (sum + area/2) / area</text>
<text x="58" y="976" class="m s12">2. colsum_sub(第 reflect101(y−r) 列)  ← 先減</text>
<text x="58" y="995" class="m s12">3. 補算新列的水平 pass，覆蓋舊列的槽位</text>
<text x="58" y="1014" class="m s12">4. colsum_add(第 reflect101(y+r+1) 列)</text>
<path d="M221,1030 L221,1052" class="e" marker-end="url(#arr)"/>
<rect x="46" y="1054" width="350" height="40" rx="6" class="data"/>
<text x="58" y="1079" class="m s12">mat_row(dst, y)：uchar</text>
<rect x="46" y="1170" width="350" height="78" rx="6" class="data"/>
<text x="58" y="1190" class="s12 b">scratch（fast_malloc）</text>
<text x="58" y="1208" class="m s12">ring + sum + pad =</text>
<text x="58" y="1226" class="m s12">nslots×n×2 + n×4 + (cols+2r)×cn</text>
<text x="58" y="1242" class="s11 sec">約 ksize × n × 2 + n × 4 + …</text>
<text x="46" y="1116" class="m s12">area = ksize × ksize</text>
<text x="46" y="1134" class="s12 sec">除法含四捨五入：(sum + area/2) / area</text>
<text x="459" y="488" class="m b">gaussian_blur(dst, src, ksize)</text>
<text x="809" y="488" class="m s11 sec end">filter.c:193-240</text>
<text x="459" y="506" class="m s12 sec">CV_8UC1/3/4 → 同型別；ksize ∈ {1, 3, 5, 7}</text>
<rect x="459" y="530" width="350" height="40" rx="6" class="data"/>
<text x="471" y="548" class="m s12">mat_row(src, y)</text>
<text x="471" y="564" class="s12 sec">uchar，cols × cn</text>
<path d="M634,570 L634,592" class="e" marker-end="url(#arr)"/>
<rect x="459" y="594" width="350" height="52" rx="6" class="kern"/>
<text x="471" y="614" class="m s12">pad_row(s, pad, cols, cn, r)，r = ksize / 2</text>
<text x="471" y="632" class="m s12 sec">pad：(cols + 2r) × cn bytes</text>
<path d="M634,646 L634,668" class="e" marker-end="url(#arr)"/>
<rect x="459" y="670" width="350" height="84" rx="6" class="kern"/>
<text x="471" y="690" class="m s12 b">gauss_hrow：acc = Σ w[k] × pad[i + k×cn]</text>
<text x="471" y="710" class="m s12">w = gauss_weights[r]，每軸總和 256</text>
<text x="471" y="730" class="s12 sec">最大 256 × 255 = 65280，放得進 <tspan class="m">uint16_t</tspan></text>
<path d="M634,754 L634,778" class="e" marker-end="url(#arr)"/>
<text x="642" y="772" class="s12 sec">for y：補算新列的水平 pass</text>
<rect x="459" y="780" width="350" height="76" rx="6" class="data"/>
<text x="471" y="800" class="m s12">ring：uint16_t[nslots × n]</text>
<text x="471" y="818" class="m s12 sec">nslots = min(ksize, rows)，n = cols × cn</text>
<text x="471" y="836" class="m s12 sec">列 y 放槽位 y % nslots（ring_slot）</text>
<path d="M634,856 L634,878" class="e" marker-end="url(#arr)"/>
<text x="642" y="872" class="s12 sec">每個輸出列 y</text>
<rect x="459" y="880" width="350" height="150" rx="6" class="kern"/>
<text x="471" y="900" class="m s12 b">gauss_vrow：acc = Σ w[k] × rows_in[k][i]</text>
<text x="471" y="922" class="m s12">rows_in[k] = ring 中第 reflect101(y+k−r) 列</text>
<text x="471" y="944" class="m s12">d = (acc + 32768) &gt;&gt; 16</text>
<text x="471" y="970" class="s12">兩軸各放大 256 倍，</text>
<text x="471" y="988" class="s12">最後一次除以 65536 並四捨五入</text>
<text x="471" y="1012" class="s12 sec">每列前先補算到第 min(y+r, rows−1) 列</text>
<path d="M634,1030 L634,1052" class="e" marker-end="url(#arr)"/>
<rect x="459" y="1054" width="350" height="40" rx="6" class="data"/>
<text x="471" y="1079" class="m s12">mat_row(dst, y)：uchar</text>
<rect x="459" y="1170" width="350" height="78" rx="6" class="data"/>
<text x="471" y="1190" class="s12 b">scratch（fast_malloc）</text>
<text x="471" y="1208" class="m s12">ring + pad =</text>
<text x="471" y="1226" class="m s12">nslots×n×2 + (cols+2r)×cn</text>
<text x="471" y="1242" class="s11 sec">約 ksize × n × 2 + …</text>
<text x="459" y="1112" class="s11 sec"><tspan class="m">gauss_weights[r]</tspan>（每軸總和皆為 256）</text>
<g class="m s11">
<text x="459" y="1128">1: {256}</text>
<text x="459" y="1142">3: {64, 128, 64}</text>
<text x="609" y="1128">5: {16, 64, 96, 64, 16}</text>
<text x="609" y="1142">7: {8, 28, 56, 72, 56, 28, 8}</text>
</g>
<text x="872" y="488" class="m b">sobel(dst, src, dx, dy)</text>
<text x="1222" y="488" class="m s11 sec end">filter.c:259-306</text>
<text x="872" y="506" class="m s12 sec">CV_8UC1 → CV_16SC1；(dx, dy) 只能是 (1, 0) 或 (0, 1)</text>
<rect x="872" y="530" width="350" height="40" rx="6" class="data"/>
<text x="884" y="548" class="m s12">mat_row(src, y)</text>
<text x="884" y="564" class="s12 sec">uchar，cols</text>
<path d="M1047,570 L1047,592" class="e" marker-end="url(#arr)"/>
<rect x="872" y="594" width="350" height="52" rx="6" class="kern"/>
<text x="884" y="614" class="m s12">pad_row(s, pad, cols, 1, 1)</text>
<text x="884" y="632" class="m s12 sec">pad：cols + 2 bytes</text>
<path d="M1047,646 L1047,668" class="e" marker-end="url(#arr)"/>
<rect x="872" y="670" width="350" height="84" rx="6" class="kern"/>
<text x="884" y="689" class="m s12 b">sobel_hrow：</text>
<text x="884" y="706" class="m s12">w[0]×p[i] + w[1]×p[i+1] + w[2]×p[i+2]</text>
<text x="884" y="723" class="m s12">dx = 1：wh = diff {−1, 0, 1}</text>
<text x="884" y="740" class="m s12">dy = 1：wh = smooth {1, 2, 1}</text>
<path d="M1047,754 L1047,778" class="e" marker-end="url(#arr)"/>
<text x="1055" y="772" class="s12 sec">for y：補算新列的水平 pass</text>
<rect x="872" y="780" width="350" height="76" rx="6" class="data"/>
<text x="884" y="800" class="m s12">ring：int16_t[nslots × cols]</text>
<text x="884" y="818" class="m s12 sec">nslots = min(3, rows)，單通道</text>
<text x="884" y="836" class="m s12 sec">列 y 放槽位 y % nslots（ring_slot）</text>
<path d="M1047,856 L1047,878" class="e" marker-end="url(#arr)"/>
<text x="1055" y="872" class="s12 sec">每個輸出列 y</text>
<rect x="872" y="880" width="350" height="150" rx="6" class="kern"/>
<text x="884" y="900" class="m s12 b">sobel_vrow：w[0]×t0 + w[1]×t1 + w[2]×t2</text>
<text x="884" y="922" class="m s12">t0 = ring 中第 reflect101(y−1) 列</text>
<text x="884" y="941" class="m s12">t1 = 第 y 列；t2 = 第 reflect101(y+1) 列</text>
<text x="884" y="960" class="m s12">dx = 1：wv = smooth；dy = 1：wv = diff</text>
<text x="884" y="988" class="s12">不縮放、不捨入；輸出範圍 ±1020</text>
<text x="884" y="1012" class="s12 sec">每列前先補算到第 min(y+1, rows−1) 列</text>
<path d="M1047,1030 L1047,1052" class="e" marker-end="url(#arr)"/>
<rect x="872" y="1054" width="350" height="40" rx="6" class="data"/>
<text x="884" y="1079" class="m s12">mat_row(dst, y)：int16_t</text>
<rect x="872" y="1170" width="350" height="78" rx="6" class="data"/>
<text x="884" y="1190" class="s12 b">scratch（fast_malloc）</text>
<text x="884" y="1208" class="m s12">ring + pad =</text>
<text x="884" y="1226" class="m s12">3×cols×2 + cols + 2</text>
<text x="884" y="1242" class="s11 sec">（rows ≥ 3 時；否則 nslots = rows）</text>
<text x="872" y="1116" class="s12 sec">要顯示時再呼叫</text>
<text x="872" y="1134" class="m s12">convert_scale_abs(edge, grad, 256, 0)</text>

<!-- ===== Scratch memory: checked sizes and failure path ===== -->
<rect x="32" y="1276" width="1216" height="132" rx="8" class="panel"/>
<text x="48" y="1298" class="h">暫存記憶體：先檢查大小，再配置，失敗一律 ASSERT（三個濾波相同）</text>
<rect x="48" y="1316" width="216" height="62" rx="6" class="kern"/>
<text x="58" y="1336" class="m s12">check_filter_dims</text>
<text x="58" y="1354" class="s12">rows、cols ≤ INT32_MAX / 4</text>
<text x="58" y="1370" class="s12 sec">不符 → ASSERT（filter.c:26-29）</text>
<rect x="290" y="1316" width="216" height="62" rx="6" class="kern"/>
<text x="300" y="1336" class="m s12">improc_scratch_mul / _add</text>
<text x="300" y="1354" class="s12">算出每一塊的位元組數</text>
<text x="300" y="1370" class="s12 sec">size_t 溢位 → ASSERT</text>
<rect x="532" y="1316" width="216" height="62" rx="6" class="data"/>
<text x="542" y="1336" class="m s12">fast_malloc × 2 或 3 塊</text>
<text x="542" y="1354" class="s12">經 allocator hook</text>
<text x="542" y="1370" class="m s11 sec">improc_set_allocator</text>
<rect x="774" y="1316" width="216" height="62" rx="6" class="kern"/>
<text x="784" y="1336" class="m s11">improc_scratch_check(blocks, n)</text>
<text x="784" y="1354" class="s12">任一塊為 NULL 嗎？</text>
<text x="784" y="1370" class="s11 sec">否 → 逐列迴圈，結束前 fast_free</text>
<rect x="1016" y="1316" width="216" height="62" rx="6" class="err"/>
<text x="1026" y="1336" class="s12">是 → 先 <tspan class="m">fast_free</tspan> 其餘區塊，</text>
<text x="1026" y="1354" class="s12">再 <tspan class="m">improc_assert_fail</tspan></text>
<text x="1026" y="1370" class="s11">handler 可 longjmp，不漏記憶體</text>
<path d="M264,1347 L288,1347" class="e" marker-end="url(#arr)"/>
<path d="M506,1347 L530,1347" class="e" marker-end="url(#arr)"/>
<path d="M748,1347 L772,1347" class="e" marker-end="url(#arr)"/>
<path d="M990,1347 L1014,1347" class="e" style="stroke:#CF222E;stroke-dasharray:5 4" marker-end="url(#arr-red)"/>
<text x="48" y="1398" class="s12 sec">ring、pad、sum 的大小都以 <tspan class="m">improc_scratch_mul</tspan> / <tspan class="m">improc_scratch_add</tspan> 計算，不會因溢位變成過小的緩衝區</text>
