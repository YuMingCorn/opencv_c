<title id="t">opencv_c 架構：建置目標、模組分層與 #include 關係</title>
<desc id="d">左側是建置目標與 improc 靜態函式庫內的模組分層；右側是各 .c 與測試檔 #include 各 header 的矩陣。</desc>
