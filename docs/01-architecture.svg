<rect x="0" y="0" width="1280" height="900" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="32" y="44" font-size="22" font-weight="700">opencv_c 架構：建置目標、模組分層與 #include 關係</text>
<text x="32" y="66" font-size="13" class="s">C 沒有繼承；這裡畫的是連結相依與標頭引用（CMakeLists.txt、core/*.h）</text>
<rect class="panel" x="32" y="90" width="600" height="778" rx="8"/><text x="48" y="114" font-size="15" font-weight="700">建置目標與模組分層</text><text x="48" y="134" font-size="12" class="s">CTest：6 個 <tspan class="m">test_*</tspan> 加上 <tspan class="m">demo_smoke</tspan>（直接執行 demo）；<tspan class="m">SKIP_RETURN_CODE 77</tspan></text><rect class="exe" x="48" y="146" width="90" height="64" rx="6"/><text x="93" y="174.6" font-size="13" class="m" font-weight="700" text-anchor="middle">demo</text><text x="93" y="191.2" font-size="12" class="m" text-anchor="middle">main.c</text><rect class="exe" x="148" y="146" width="175" height="64" rx="6"/><text x="235.5" y="175.1" font-size="13" class="m" font-weight="700" text-anchor="middle">bench_gray</text><text x="235.5" y="190.8" font-size="11" class="m" text-anchor="middle">benchmarks/bench_gray.c</text><rect class="exe" x="333" y="146" width="283" height="64" rx="6"/><text x="474.5" y="174.3" font-size="11" class="m" text-anchor="middle">test_mat · test_color · test_pixel</text><text x="474.5" y="189.3" font-size="11" class="m" text-anchor="middle">test_filter · test_geometry · test_io</text><path class="ln" d="M93,210 L93,226"/><path class="ln" d="M235.5,210 L235.5,226"/><path class="ln" d="M474.5,210 L474.5,226"/><path class="ln" d="M93,226 L474.5,226"/><path class="ln" d="M284,226 L284,248" marker-end="url(#arr)"/><text x="292" y="242" font-size="12" class="m s">target_link_libraries(... PRIVATE improc)</text><rect class="panel" x="48" y="250" width="568" height="490" rx="8" stroke-dasharray="5 4"/><text x="64" y="274" font-size="15" font-weight="700">improc（STATIC library）</text><text x="600" y="274" font-size="12" class="m s" text-anchor="end">target_include_directories(improc PUBLIC core)</text><rect class="api" x="64" y="300" width="536" height="40" rx="6"/><text x="332" y="324.2" font-size="12" text-anchor="middle"><tspan class="m">improc.h</tspan>：umbrella header，include 其餘六個 header</text><rect class="api" x="64" y="364" width="125" height="96" rx="6"/><text x="126.5" y="408.7" font-size="12" class="m" font-weight="700" text-anchor="middle">color.h/.c</text><text x="126.5" y="423.9" font-size="11" class="m" text-anchor="middle">cvt_color</text><rect class="api" x="201" y="364" width="125" height="96" rx="6"/><text x="263.5" y="386.2" font-size="12" class="m" font-weight="700" text-anchor="middle">pixel.h/.c</text><text x="263.5" y="401.4" font-size="11" class="m" text-anchor="middle">threshold</text><text x="263.5" y="416.4" font-size="11" class="m" text-anchor="middle">mat_lut</text><text x="263.5" y="431.4" font-size="11" class="m" text-anchor="middle">convert_scale</text><text x="263.5" y="446.4" font-size="11" class="m" text-anchor="middle">convert_scale_abs</text><rect class="api" x="338" y="364" width="125" height="96" rx="6"/><text x="400.5" y="393.7" font-size="12" class="m" font-weight="700" text-anchor="middle">filter.h/.c</text><text x="400.5" y="408.9" font-size="11" class="m" text-anchor="middle">box_filter</text><text x="400.5" y="423.9" font-size="11" class="m" text-anchor="middle">gaussian_blur</text><text x="400.5" y="438.9" font-size="11" class="m" text-anchor="middle">sobel</text><rect class="api" x="475" y="364" width="125" height="96" rx="6"/><text x="537.5" y="401.2" font-size="12" class="m" font-weight="700" text-anchor="middle">geometry.h/.c</text><text x="537.5" y="416.4" font-size="11" class="m" text-anchor="middle">flip</text><text x="537.5" y="431.4" font-size="11" class="m" text-anchor="middle">resize</text><path class="ln" d="M126.5,460 L126.5,480"/><path class="ln" d="M263.5,460 L263.5,480"/><path class="ln" d="M400.5,460 L400.5,480"/><path class="ln" d="M537.5,460 L537.5,480"/><path class="ln" d="M126.5,480 L537.5,480"/><path class="ln" d="M254,480 L254,508" marker-end="url(#arr)"/><text x="262" y="500" font-size="12" class="s"><tspan class="m">struct Mat</tspan>、<tspan class="m">mat_row</tspan>、<tspan class="m">mat_type</tspan></text><rect class="data" x="64" y="510" width="340" height="100" rx="6"/><text x="234" y="532.2" font-size="12" class="m" font-weight="700" text-anchor="middle">mat.h / mat.c</text><text x="234" y="548.2" font-size="12" text-anchor="middle"><tspan class="m">struct Mat</tspan>、<tspan class="m">CV_*</tspan> type macros</text><text x="234" y="564.2" font-size="12" class="m" text-anchor="middle">alloc_mat / alloc_mat_synthetic / free_mat</text><text x="234" y="580.2" font-size="12" class="m" text-anchor="middle">alloc_mat_from_file / alloc_mat_from_buffer</text><text x="234" y="596.2" font-size="12" class="m" text-anchor="middle">mat_row / mat_at / mat_info / mat_write</text><rect class="ext" x="470" y="510" width="130" height="100" rx="6"/><text x="535" y="540.4" font-size="11" class="m" text-anchor="middle">stb_image.h</text><text x="535" y="555.4" font-size="11" class="m" text-anchor="middle">stb_image_write.h</text><text x="535" y="571.2" font-size="12" text-anchor="middle">第三方，維持原樣</text><text x="535" y="587.2" font-size="12" text-anchor="middle">只有 mat.c include</text><path class="ln" d="M406,560 L468,560" marker-end="url(#arr)"/><text x="437" y="552" font-size="11" class="m s" text-anchor="middle">#include</text><text x="600" y="630" font-size="11" class="s" text-anchor="end"><tspan class="m">STB_IMAGE_IMPLEMENTATION</tspan> 定義於 mat.c</text><path class="ln" d="M234,610 L234,660" marker-end="url(#arr)"/><text x="226" y="640" font-size="12" class="m s" text-anchor="end">ASSERT、fast_malloc</text><rect class="kern" x="64" y="660" width="536" height="72" rx="6"/><text x="332" y="677.2" font-size="12" class="m" font-weight="700" text-anchor="middle">utils.h / utils.c</text><text x="332" y="693.2" font-size="12" text-anchor="middle"><tspan class="m">ASSERT</tspan>、<tspan class="m">fast_malloc</tspan> / <tspan class="m">fast_free</tspan>（16-byte 對齊）</text><text x="332" y="708.4" font-size="11" text-anchor="middle">color.c、pixel.c、filter.c、geometry.c、mat.c 都用 <tspan class="m">ASSERT</tspan>；</text><text x="332" y="723.4" font-size="11" text-anchor="middle">filter.c、geometry.c、mat.c 另用 <tspan class="m">fast_malloc</tspan></text><path class="ln" d="M332,740 L332,768" marker-end="url(#arr)"/><rect class="ext" x="48" y="770" width="568" height="60" rx="6"/><text x="332" y="796.5" font-size="13" class="m" text-anchor="middle">libc · libm（僅 UNIX）· Threads::Threads</text><text x="332" y="813.2" font-size="12" text-anchor="middle">PUBLIC 連結；目前 core 內沒有任何檔案 include pthread</text><rect class="panel" x="664" y="90" width="584" height="778" rx="8"/><text x="680" y="114" font-size="15" font-weight="700"><tspan class="m">#include</tspan> 矩陣（列 include 欄）</text><circle cx="684" cy="130" r="5" fill="#0969DA"/><text x="696" y="134" font-size="12">直接 include</text><circle cx="790" cy="130" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><text x="802" y="134" font-size="12">經由其他 header 間接取得</text><text class="m" x="828" y="218" font-size="12" transform="rotate(-60 828 218)">improc.h</text><text class="m" x="868" y="218" font-size="12" transform="rotate(-60 868 218)">color.h</text><text class="m" x="908" y="218" font-size="12" transform="rotate(-60 908 218)">pixel.h</text><text class="m" x="948" y="218" font-size="12" transform="rotate(-60 948 218)">filter.h</text><text class="m" x="988" y="218" font-size="12" transform="rotate(-60 988 218)">geometry.h</text><text class="m" x="1028" y="218" font-size="12" transform="rotate(-60 1028 218)">mat.h</text><text class="m" x="1068" y="218" font-size="12" transform="rotate(-60 1068 218)">utils.h</text><text class="m" x="1108" y="218" font-size="12" transform="rotate(-60 1108 218)">stb_image*.h</text><text class="m" x="1148" y="218" font-size="12" transform="rotate(-60 1148 218)">test_util.h</text><text class="m" x="1188" y="218" font-size="12" transform="rotate(-60 1188 218)">test_mat_util.h</text><rect x="696" y="230" width="512" height="28" fill="#F6F8FA"/><text x="804" y="248" font-size="12" class="m" text-anchor="end">color.c</text><circle cx="868" cy="244" r="5" fill="#0969DA"/><circle cx="1028" cy="244" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1068" cy="244" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><text x="804" y="276" font-size="12" class="m" text-anchor="end">pixel.c</text><circle cx="908" cy="272" r="5" fill="#0969DA"/><circle cx="1028" cy="272" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1068" cy="272" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><rect x="696" y="286" width="512" height="28" fill="#F6F8FA"/><text x="804" y="304" font-size="12" class="m" text-anchor="end">filter.c</text><circle cx="948" cy="300" r="5" fill="#0969DA"/><circle cx="1028" cy="300" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1068" cy="300" r="5" fill="#0969DA"/><text x="804" y="332" font-size="12" class="m" text-anchor="end">geometry.c</text><circle cx="988" cy="328" r="5" fill="#0969DA"/><circle cx="1028" cy="328" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1068" cy="328" r="5" fill="#0969DA"/><rect x="696" y="342" width="512" height="28" fill="#F6F8FA"/><text x="804" y="360" font-size="12" class="m" text-anchor="end">mat.c</text><circle cx="1028" cy="356" r="5" fill="#0969DA"/><circle cx="1068" cy="356" r="5" fill="#0969DA"/><circle cx="1108" cy="356" r="5" fill="#0969DA"/><text x="804" y="388" font-size="12" class="m" text-anchor="end">utils.c</text><circle cx="1068" cy="384" r="5" fill="#0969DA"/><rect x="696" y="398" width="512" height="28" fill="#F6F8FA"/><text x="804" y="416" font-size="12" class="m" text-anchor="end">main.c</text><circle cx="828" cy="412" r="5" fill="#0969DA"/><circle cx="868" cy="412" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="908" cy="412" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="948" cy="412" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="988" cy="412" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1028" cy="412" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1068" cy="412" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><text x="804" y="444" font-size="12" class="m" text-anchor="end">bench_gray.c</text><circle cx="828" cy="440" r="5" fill="#0969DA"/><circle cx="868" cy="440" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="908" cy="440" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="948" cy="440" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="988" cy="440" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1028" cy="440" r="5" fill="#0969DA"/><circle cx="1068" cy="440" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><rect x="696" y="454" width="512" height="28" fill="#F6F8FA"/><text x="804" y="472" font-size="12" class="m" text-anchor="end">test_mat.c</text><circle cx="1028" cy="468" r="5" fill="#0969DA"/><circle cx="1068" cy="468" r="5" fill="#0969DA"/><circle cx="1148" cy="468" r="5" fill="#0969DA"/><text x="804" y="500" font-size="12" class="m" text-anchor="end">test_color.c</text><circle cx="868" cy="496" r="5" fill="#0969DA"/><circle cx="1028" cy="496" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1068" cy="496" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1148" cy="496" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1188" cy="496" r="5" fill="#0969DA"/><rect x="696" y="510" width="512" height="28" fill="#F6F8FA"/><text x="804" y="528" font-size="12" class="m" text-anchor="end">test_pixel.c</text><circle cx="908" cy="524" r="5" fill="#0969DA"/><circle cx="1028" cy="524" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1068" cy="524" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1148" cy="524" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1188" cy="524" r="5" fill="#0969DA"/><text x="804" y="556" font-size="12" class="m" text-anchor="end">test_filter.c</text><circle cx="948" cy="552" r="5" fill="#0969DA"/><circle cx="1028" cy="552" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1148" cy="552" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1188" cy="552" r="5" fill="#0969DA"/><rect x="696" y="566" width="512" height="28" fill="#F6F8FA"/><text x="804" y="584" font-size="12" class="m" text-anchor="end">test_geometry.c</text><circle cx="988" cy="580" r="5" fill="#0969DA"/><circle cx="1028" cy="580" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1148" cy="580" r="5" fill="none" stroke="#57606A" stroke-width="1.5"/><circle cx="1188" cy="580" r="5" fill="#0969DA"/><text x="804" y="612" font-size="12" class="m" text-anchor="end">test_io.c</text><circle cx="1028" cy="608" r="5" fill="#0969DA"/><circle cx="1148" cy="608" r="5" fill="#0969DA"/><circle cx="1188" cy="608" r="5" fill="#0969DA"/><path class="grid" d="M808,230 V622"/><path class="grid" d="M848,230 V622"/><path class="grid" d="M888,230 V622"/><path class="grid" d="M928,230 V622"/><path class="grid" d="M968,230 V622"/><path class="grid" d="M1008,230 V622"/><path class="grid" d="M1048,230 V622"/><path class="grid" d="M1088,230 V622"/><path class="grid" d="M1128,230 V622"/><path class="grid" d="M1168,230 V622"/><path class="grid" d="M1208,230 V622"/><path class="grid" d="M696,230 H1208"/><path class="grid" d="M696,258 H1208"/><path class="grid" d="M696,286 H1208"/><path class="grid" d="M696,314 H1208"/><path class="grid" d="M696,342 H1208"/><path class="grid" d="M696,370 H1208"/><path fill="none" stroke="#6E7781" stroke-width="2" d="M696,398 H1208"/><path class="grid" d="M696,426 H1208"/><path fill="none" stroke="#6E7781" stroke-width="2" d="M696,454 H1208"/><path class="grid" d="M696,482 H1208"/><path class="grid" d="M696,510 H1208"/><path class="grid" d="M696,538 H1208"/><path class="grid" d="M696,566 H1208"/><path class="grid" d="M696,594 H1208"/><path class="grid" d="M696,622 H1208"/><text x="684" y="314" font-size="12" class="s" text-anchor="middle" transform="rotate(-90 684 314)">core</text><text x="684" y="426" font-size="12" class="s" text-anchor="middle" transform="rotate(-90 684 426)">程式</text><text x="684" y="538" font-size="12" class="s" text-anchor="middle" transform="rotate(-90 684 538)">tests</text><text x="680" y="664" font-size="15" font-weight="700">各 header 的 include 關係</text><text x="680" y="692" font-size="12" class="m">improc.h → color.h, filter.h, geometry.h, mat.h, pixel.h, utils.h</text><text x="680" y="714" font-size="12" class="m">color.h, pixel.h → mat.h, utils.h</text><text x="680" y="736" font-size="12" class="m">filter.h, geometry.h → mat.h</text><text x="680" y="758" font-size="12" class="m">tests/test_mat_util.h → mat.h, test_util.h</text><text x="680" y="780" font-size="12" class="m">mat.h, utils.h, tests/test_util.h → 只 include 標準函式庫</text><text x="680" y="812" font-size="12" class="s">main.c 與 bench_gray.c 只 include improc.h，其餘 header 透過它取得。</text><text x="680" y="832" font-size="12" class="s">test_*.c 位於 tests/，main.c 在專案根目錄，bench_gray.c 在 benchmarks/。</text></svg>
