<text x="32" y="44" font-size="22" font-weight="700">opencv_c 架構：建置目標、模組分層與 #include 關係</text>
<text x="32" y="66" font-size="13" class="s">C 沒有繼承；這裡畫的是連結相依與標頭引用（CMakeLists.txt、core/*.h）</text>
