<title id="t">resize 座標對應：半像素中心、x0 / x1 / fx 表與 Q8 權重</title>
<desc id="d">以 sw = 4、dw = 8 為例，說明 resize 的半像素中心對應、查表內容，以及 INTER_NEAREST 與 INTER_LINEAR 的處理流程。</desc>
